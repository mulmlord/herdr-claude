
# Claude's default rows, plus the running subagents of the session, which
# claude-herdr-subagents reports as pane tokens: "3 agents · 1 shell" after the
# agent name, then per subagent its index (shape and code, colored by family:
# the rules match " A" … " P"), its task and, dimmed, what it is doing.
# Unreported tokens and rows left without tokens disappear.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "machine", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent", { token = "$subs", dim = true }],
  [{ token = "$sa1k", rules = [{ contains = " A", fg = "#E69F00", bold = true }, { contains = " B", fg = "#56B4E9", bold = true }, { contains = " C", fg = "#009E73", bold = true }, { contains = " D", fg = "#F0E442", bold = true }, { contains = " E", fg = "#0072B2", bold = true }, { contains = " F", fg = "#D55E00", bold = true }, { contains = " G", fg = "#CC79A7", bold = true }, { contains = " H", fg = "#88CCEE", bold = true }, { contains = " I", fg = "#E69F00", bold = true }, { contains = " J", fg = "#56B4E9", bold = true }, { contains = " K", fg = "#009E73", bold = true }, { contains = " L", fg = "#F0E442", bold = true }, { contains = " M", fg = "#0072B2", bold = true }, { contains = " N", fg = "#D55E00", bold = true }, { contains = " O", fg = "#CC79A7", bold = true }, { contains = " P", fg = "#88CCEE", bold = true }] }, "$sa1"], [{ token = "$sa1do", dim = true }],
  [{ token = "$sa2k", rules = [{ contains = " A", fg = "#E69F00", bold = true }, { contains = " B", fg = "#56B4E9", bold = true }, { contains = " C", fg = "#009E73", bold = true }, { contains = " D", fg = "#F0E442", bold = true }, { contains = " E", fg = "#0072B2", bold = true }, { contains = " F", fg = "#D55E00", bold = true }, { contains = " G", fg = "#CC79A7", bold = true }, { contains = " H", fg = "#88CCEE", bold = true }, { contains = " I", fg = "#E69F00", bold = true }, { contains = " J", fg = "#56B4E9", bold = true }, { contains = " K", fg = "#009E73", bold = true }, { contains = " L", fg = "#F0E442", bold = true }, { contains = " M", fg = "#0072B2", bold = true }, { contains = " N", fg = "#D55E00", bold = true }, { contains = " O", fg = "#CC79A7", bold = true }, { contains = " P", fg = "#88CCEE", bold = true }] }, "$sa2"], [{ token = "$sa2do", dim = true }],
  [{ token = "$sa3k", rules = [{ contains = " A", fg = "#E69F00", bold = true }, { contains = " B", fg = "#56B4E9", bold = true }, { contains = " C", fg = "#009E73", bold = true }, { contains = " D", fg = "#F0E442", bold = true }, { contains = " E", fg = "#0072B2", bold = true }, { contains = " F", fg = "#D55E00", bold = true }, { contains = " G", fg = "#CC79A7", bold = true }, { contains = " H", fg = "#88CCEE", bold = true }, { contains = " I", fg = "#E69F00", bold = true }, { contains = " J", fg = "#56B4E9", bold = true }, { contains = " K", fg = "#009E73", bold = true }, { contains = " L", fg = "#F0E442", bold = true }, { contains = " M", fg = "#0072B2", bold = true }, { contains = " N", fg = "#D55E00", bold = true }, { contains = " O", fg = "#CC79A7", bold = true }, { contains = " P", fg = "#88CCEE", bold = true }] }, "$sa3"], [{ token = "$sa3do", dim = true }],
  [{ token = "$sa4k", rules = [{ contains = " A", fg = "#E69F00", bold = true }, { contains = " B", fg = "#56B4E9", bold = true }, { contains = " C", fg = "#009E73", bold = true }, { contains = " D", fg = "#F0E442", bold = true }, { contains = " E", fg = "#0072B2", bold = true }, { contains = " F", fg = "#D55E00", bold = true }, { contains = " G", fg = "#CC79A7", bold = true }, { contains = " H", fg = "#88CCEE", bold = true }, { contains = " I", fg = "#E69F00", bold = true }, { contains = " J", fg = "#56B4E9", bold = true }, { contains = " K", fg = "#009E73", bold = true }, { contains = " L", fg = "#F0E442", bold = true }, { contains = " M", fg = "#0072B2", bold = true }, { contains = " N", fg = "#D55E00", bold = true }, { contains = " O", fg = "#CC79A7", bold = true }, { contains = " P", fg = "#88CCEE", bold = true }] }, "$sa4"], [{ token = "$sa4do", dim = true }],
  [{ token = "$sa5k", rules = [{ contains = " A", fg = "#E69F00", bold = true }, { contains = " B", fg = "#56B4E9", bold = true }, { contains = " C", fg = "#009E73", bold = true }, { contains = " D", fg = "#F0E442", bold = true }, { contains = " E", fg = "#0072B2", bold = true }, { contains = " F", fg = "#D55E00", bold = true }, { contains = " G", fg = "#CC79A7", bold = true }, { contains = " H", fg = "#88CCEE", bold = true }, { contains = " I", fg = "#E69F00", bold = true }, { contains = " J", fg = "#56B4E9", bold = true }, { contains = " K", fg = "#009E73", bold = true }, { contains = " L", fg = "#F0E442", bold = true }, { contains = " M", fg = "#0072B2", bold = true }, { contains = " N", fg = "#D55E00", bold = true }, { contains = " O", fg = "#CC79A7", bold = true }, { contains = " P", fg = "#88CCEE", bold = true }] }, "$sa5"], [{ token = "$sa5do", dim = true }],
  [{ token = "$sa_more", dim = true }],
]

# Each space with where its folder lies (token $path from claude-herdr-subagents),
# otherwise herdr's default space rows. Paths need a little more room than the
# default sidebar width of 26: set sidebar_width = 32 under [ui].
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "$path", dim = true }],
  ["branch", "git_status"],
]
